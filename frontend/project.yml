name: Placed

options:
  bundleIdPrefix: com.placementprep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Placed:
    type: application
    platform: auto
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Placed
        excludes:
          - "Resources/Info.plist"
          - "Resources/Placed.entitlements"
          - "Resources/Companies"
          - "Resources/Quizzes"
          - "Resources/Logos"
      - path: Placed/Resources/Companies
        type: folder
      - path: Placed/Resources/Quizzes
        type: folder
      - path: Placed/Resources/Logos
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placementprep.app
        PRODUCT_NAME: Placed
        INFOPLIST_FILE: Placed/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Placed/Resources/Placed.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconTier2 AppIconTier3 AppIconTier4 AppIconTier5 AppIconTier6"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Written into Info.plist as PPBackendURL. "$()" stops "//" being read as a comment.
        Debug:
          PP_BACKEND_URL: "http:/$()/localhost:8000"
        Release:
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
          PP_BACKEND_URL: "https:/$()/placementprep-api.fly.dev"

  PlacedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlacedTests
    dependencies:
      - target: Placed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placementprep.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Placed.app/Placed"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Placed:
    build:
      targets:
        Placed: all
        PlacedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Placed
      targets:
        - PlacedTests
    archive:
      config: Release
