name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: WARNING
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # -t . makes backend/tests/__init__.py run, which supplies a test-only
      # JWT_SECRET_KEY, so no .env is needed.
      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

      # Build a fresh database from the migrations, then fail if the models
      # have changes that no migration covers.
      - name: Check models and migrations agree
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrations.db
        run: |
          python -c "from database.db import init_db; init_db()"
          alembic -c database/alembic.ini check

  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      # Swift Testing needs Xcode 16+; the macos-26 image ships Xcode 26.x.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is not committed; generate it from project.yml.
      - name: Generate Xcode project
        working-directory: frontend
        run: xcodegen generate

      # Simulator names differ between runner images, so use the newest
      # available iPhone instead of a hard-coded name.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, sims in devices.items():
              match = re.search(r"SimRuntime\.iOS-([\d-]+)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              for sim in sims:
                  if sim["name"].startswith("iPhone"):
                      key = (version, sim["name"])
                      if best is None or key > best[0]:
                          best = (key, sim["udid"], sim["name"], runtime)
          if best is None:
              sys.exit("No available iPhone simulator found")
          print(f"Using {best[2]} ({best[3]})", file=sys.stderr)
          print(best[1])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: frontend
        run: |
          xcodebuild test \
            -project Placed.xcodeproj \
            -scheme Placed \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/PlacedTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PlacedTests.xcresult
          path: ${{ runner.temp }}/PlacedTests.xcresult
          retention-days: 7
